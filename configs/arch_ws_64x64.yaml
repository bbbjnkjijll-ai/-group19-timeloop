arch:
  arithmetic:
    instances: 4096
    meshX: 64
    word_bits: 8
  storage:
    - name: Registers
      entries: 1
      instances: 4096
      meshX: 64
      word_bits: 8
    - name: GlobalBuffer
      sizeKB: 1024
      instances: 1
      word_bits: 8
    - name: DRAM
      technology: DRAM
      instances: 1
      word_bits: 8

architecture_constraints:
  targets:
    - target: Registers
      type: bypass
      bypass: [Inputs, Outputs]
      keep: [Weights]
    - target: GlobalBuffer
      type: bypass
      bypass: [Weights]
      keep: [Inputs, Outputs]
